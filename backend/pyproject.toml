[project]
name = "masterfranchises-api"
version = "0.1.0"
description = "API for franchise recommendations and premises comparison in Poland"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "ijson>=3,<4",
]

[dependency-groups]
dev = [
    { include-group = "model" },
    "httpx2>=2.16.0",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
model = [
    "joblib>=1.4,<2",
    "numpy>=2,<3",
    "scikit-learn==1.9.1",
    "threadpoolctl>=3.5,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
