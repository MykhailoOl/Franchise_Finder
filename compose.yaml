name: masterfranchises

services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masterfranchises}
      POSTGRES_USER: ${POSTGRES_USER:-masterfranchises}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masterfranchises_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/20-masterfranchises.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT PostGIS_Version()' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-masterfranchises}
      POSTGRES_USER: ${POSTGRES_USER:-masterfranchises}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masterfranchises_dev}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      WATCHFILES_FORCE_POLLING: ${DEV_USE_POLLING:-true}
      WATCHFILES_POLL_DELAY_MS: "500"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      DEV_USE_POLLING: ${DEV_USE_POLLING:-true}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
